name: Build APK 2
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -o untold-app.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: untold-app
        run: |
          sed -i 's/beta\.7/beta.8/' package.json
          npm install --legacy-peer-deps
          npx cap add android
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp resources/android/mipmap-$d/* android/app/src/main/res/mipmap-$d/; done
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: untold-apk
          path: untold-app/android/app/build/outputs/apk/debug/app-debug.apk
